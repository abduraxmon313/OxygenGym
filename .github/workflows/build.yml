name: Build & Release OxygenGym

# main'ga merge qilinganda: package.json dagi versiya uchun release hali bo'lmasa,
# Windows'da .exe yig'iladi va GitHub Releases'ga chiqariladi.
# O'rnatilgan dasturlar shu release'ni ko'rib, o'zi yangilanadi.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION allaqachon chiqarilgan — build o'tkazib yuboriladi"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install

      - name: Build React UI
        working-directory: renderer
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: OxygenGym v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/OxygenGym-Setup-*.exe
            dist/OxygenGym-Setup-*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
